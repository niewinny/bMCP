[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmcp"
version = "0.1.0"
description = "Python SDK for building MCP (Model Context Protocol) servers"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "starlette>=0.50.0",
    "sse-starlette>=3.0.0",
    "uvicorn>=0.38.0",
    "anyio>=4.0.0",
    "websockets>=15.0.0",
]

[project.scripts]
bmcp-stdio = "bmcp.transport.stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bmcp"]
